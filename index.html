<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Dinámico</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0fdf4;
            padding-top: 100px;
        }

        h1 {
            color: #166534;
        }

        #valor {
            font-size: 60px;
            font-weight: bold;
            color: #0f172a;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background-color: #16a34a;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #15803d;
        }

        #btn-restar {
            background-color: #dc2626;
        }

        #btn-restar:hover {
            background-color: #b91c1c;
        }
    </style>
</head>

<body>

    <h1>Contador Dinámico</h1>

    <p id="valor">0</p>

    <button id="btn-incrementar">Sumar</button>
    <button id="btn-restar">Restar</button>

    <script src="app.js"></script>

</body>
</html>
